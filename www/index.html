<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Advanced Crypto AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #0b0f14;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .box {
            background: #151b24;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .title {
            font-size: 13px;
            color: #8d99a8;
            margin-bottom: 8px;
        }

        .price {
            font-size: 34px;
            font-weight: bold;
        }

        .value {
            font-size: 22px;
            font-weight: bold;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #252d38;
        }

        .row:last-child {
            border-bottom: none;
        }

        .green {
            color: #38e89a;
        }

        .red {
            color: #ff5964;
        }

        .yellow {
            color: #ffc857;
        }

        .blue {
            color: #58a6ff;
        }

        #status {
            margin-top: 10px;
            font-size: 14px;
        }

        #updated {
            margin-top: 8px;
            color: #777;
            font-size: 12px;
        }

    </style>

</head>


<body>


<h1>
    Advanced Crypto AI
</h1>


<!-- ====================================== -->
<!-- BTC PRICE -->
<!-- ====================================== -->

<div class="box">

    <div class="title">
        BTC / USDT
    </div>

    <div
        id="btcPrice"
        class="price"
    >
        Loading...
    </div>

    <div
        id="status"
        class="green"
    >
        ● CONNECTING...
    </div>

    <div id="updated">
        Waiting for data...
    </div>

</div>


<!-- ====================================== -->
<!-- BTC VOLUME -->
<!-- ====================================== -->

<div class="box">

    <div class="title">
        BTC MARKET VOLUME
    </div>


    <div class="row">

        <span>
            1H Volume
        </span>

        <span
            id="volume1h"
            class="value"
        >
            Loading...
        </span>

    </div>


    <div class="row">

        <span>
            24H Volume
        </span>

        <span
            id="volume24h"
            class="value"
        >
            Loading...
        </span>

    </div>

</div>


<!-- ====================================== -->
<!-- BTC LIQUIDATIONS -->
<!-- ====================================== -->

<div class="box">

    <div class="title">
        BTC LIQUIDATIONS — PUBLIC DATA
    </div>


    <div class="row">

        <span>
            Long Liquidation
        </span>

        <span
            id="longLiquidation"
            class="value red"
        >
            Loading...
        </span>

    </div>


    <div class="row">

        <span>
            Short Liquidation
        </span>

        <span
            id="shortLiquidation"
            class="value green"
        >
            Loading...
        </span>

    </div>


    <div class="row">

        <span>
            Total Liquidation
        </span>

        <span
            id="totalLiquidation"
            class="value yellow"
        >
            Loading...
        </span>

    </div>


    <div class="row">

        <span>
            Liquidation Events
        </span>

        <span
            id="liquidationEvents"
            class="value blue"
        >
            Loading...
        </span>

    </div>

</div>


<script>


/* ====================================== */
/* BINANCE API */
/* ====================================== */


const PRICE_API =
    "https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT";


const KLINE_API =
    "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=24";


/* ====================================== */
/* PUBLIC LIQUIDATION API */
/* ====================================== */


/*
 * MarginPad public liquidation API.
 *
 * No API key required.
 *
 * 24H market liquidation data.
 */

const LIQUIDATION_API =
    "https://marginpad.io/api/v1/liquidations";


/* ====================================== */
/* FORMAT FUNCTIONS */
/* ====================================== */


function formatUSD(value) {

    const number =
        Number(value);

    if (!Number.isFinite(number)) {

        return "--";

    }

    return "$" +
        number.toLocaleString(
            "en-US",
            {
                maximumFractionDigits: 0
            }
        );

}


/* ====================================== */
/* BINANCE MARKET DATA */
/* ====================================== */


async function loadMarket() {

    try {


        /* ============================== */
        /* BTC PRICE */
        /* ============================== */


        const priceResponse =
            await fetch(
                PRICE_API
            );


        if (!priceResponse.ok) {

            throw new Error(
                "Binance price error " +
                priceResponse.status
            );

        }


        const priceData =
            await priceResponse.json();


        const btcPrice =
            Number(
                priceData.price
            );


        document.getElementById(
            "btcPrice"
        ).textContent =

            "$" +

            btcPrice.toLocaleString(
                "en-US",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );


        /* ============================== */
        /* BTC VOLUME */
        /* ============================== */


        const volumeResponse =
            await fetch(
                KLINE_API
            );


        if (!volumeResponse.ok) {

            throw new Error(
                "Binance volume error " +
                volumeResponse.status
            );

        }


        const candles =
            await volumeResponse.json();


        if (
            !Array.isArray(candles) ||
            candles.length === 0
        ) {

            throw new Error(
                "No Binance volume data"
            );

        }


        /* ============================== */
        /* 1H BTC VOLUME */
        /* ============================== */


        const latest =
            candles[
                candles.length - 1
            ];


        /*
         * Binance Kline [5]
         * = BTC base-asset volume
         */

        const volume1h =
            Number(
                latest[5]
            );


        document.getElementById(
            "volume1h"
        ).textContent =

            volume1h.toLocaleString(
                "en-US",
                {
                    maximumFractionDigits: 2
                }
            ) + " BTC";


        /* ============================== */
        /* 24H BTC VOLUME */
        /* ============================== */


        let volume24h = 0;


        candles.forEach(
            function(candle) {

                volume24h +=
                    Number(
                        candle[5]
                    );

            }
        );


        document.getElementById(
            "volume24h"
        ).textContent =

            volume24h.toLocaleString(
                "en-US",
                {
                    maximumFractionDigits: 2
                }
            ) + " BTC";


        /* ============================== */
        /* BINANCE STATUS */
        /* ============================== */


        document.getElementById(
            "status"
        ).textContent =
            "● BINANCE LIVE";


        document.getElementById(
            "status"
        ).className =
            "green";


        document.getElementById(
            "updated"
        ).textContent =

            "Updated: " +
            new Date()
                .toLocaleTimeString();


    }

    catch (error) {

        console.error(
            "Market error:",
            error
        );


        document.getElementById(
            "status"
        ).textContent =
            "● MARKET DATA ERROR";


        document.getElementById(
            "status"
        ).className =
            "red";


        document.getElementById(
            "updated"
        ).textContent =
            error.message;

    }

}


/* ====================================== */
/* PUBLIC BTC LIQUIDATION DATA */
/* ====================================== */


async function loadLiquidations() {

    try {


        /*
         * Ask MarginPad for its
         * public 24H liquidation data.
         */

        const response =
            await fetch(
                LIQUIDATION_API
            );


        if (!response.ok) {

            throw new Error(
                "Liquidation API error " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "Liquidation data:",
            result
        );


        if (
            !result.ok ||
            !result.data
        ) {

            throw new Error(
                "Invalid liquidation response"
            );

        }


        const data =
            result.data;


        /*
         * The public endpoint contains
         * market totals plus per-coin data.
         */


        let btc = null;


        /*
         * Look for BTC in the coin list.
         */

        if (
            Array.isArray(
                data.coins
            )
        ) {

            btc =
                data.coins.find(
                    function(item) {

                        return String(
                            item.symbol ||
                            item.coin ||
                            ""
                        ).toUpperCase()
                        === "BTC";

                    }
                );

        }


        /*
         * Some responses may use rows.
         */

        if (
            !btc &&
            Array.isArray(
                data.rows
            )
        ) {

            btc =
                data.rows.find(
                    function(item) {

                        return String(
                            item.symbol ||
                            item.coin ||
                            ""
                        ).toUpperCase()
                        === "BTC";

                    }
                );

        }


        /*
         * If BTC-specific data exists,
         * use it.
         */

        if (btc) {


            const longLiquidation =
                Number(
                    btc.long ||
                    btc.longLiquidation ||
                    btc.long_liquidation ||
                    0
                );


            const shortLiquidation =
                Number(
                    btc.short ||
                    btc.shortLiquidation ||
                    btc.short_liquidation ||
                    0
                );


            let totalLiquidation =
                Number(
                    btc.total ||
                    btc.totalLiquidation ||
                    btc.total_liquidation ||
                    0
                );


            /*
             * If total isn't supplied,
             * calculate it.
             */

            if (
                totalLiquidation === 0
            ) {

                totalLiquidation =
                    longLiquidation +
                    shortLiquidation;

            }


            const events =
                Number(
                    btc.count ||
                    btc.events ||
                    btc.eventCount ||
                    0
                );


            /* ========================== */
            /* DISPLAY BTC DATA */
            /* ========================== */


            document.getElementById(
                "longLiquidation"
            ).textContent =

                formatUSD(
                    longLiquidation
                );


            document.getElementById(
                "shortLiquidation"
            ).textContent =

                formatUSD(
                    shortLiquidation
                );


            document.getElementById(
                "totalLiquidation"
            ).textContent =

                formatUSD(
                    totalLiquidation
                );


            document.getElementById(
                "liquidationEvents"
            ).textContent =

                events.toLocaleString(
                    "en-US"
                );


            return;

        }


        /*
         * If BTC-specific breakdown is
         * not exposed in the response,
         * show the actual API response
         * state instead of inventing data.
         */

        throw new Error(
            "BTC liquidation breakdown unavailable"
        );


    }

    catch (error) {

        console.error(
            "Liquidation error:",
            error
        );


        document.getElementById(
            "longLiquidation"
        ).textContent =
            "DATA ERROR";


        document.getElementById(
            "shortLiquidation"
        ).textContent =
            "DATA ERROR";


        document.getElementById(
            "totalLiquidation"
        ).textContent =
            "DATA ERROR";


        document.getElementById(
            "liquidationEvents"
        ).textContent =
            "DATA ERROR";

    }

}


/* ====================================== */
/* APPLICATION START */
/* ====================================== */


loadMarket();

loadLiquidations();


/* ====================================== */
/* AUTO REFRESH */
/* ====================================== */


setInterval(
    function() {

        loadMarket();

        loadLiquidations();

    },
    15000
);


</script>


</body>

</html>
