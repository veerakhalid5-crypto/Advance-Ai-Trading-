<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advanced Crypto AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #0b0f14;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .box {
            background: #151b24;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .title {
            font-size: 13px;
            color: #8d99a8;
            margin-bottom: 8px;
        }

        .price {
            font-size: 34px;
            font-weight: bold;
        }

        .value {
            font-size: 22px;
            font-weight: bold;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #252d38;
        }

        .row:last-child {
            border-bottom: none;
        }

        .green {
            color: #38e89a;
        }

        .red {
            color: #ff5964;
        }

        .yellow {
            color: #ffc857;
        }

        #status {
            margin-top: 10px;
            font-size: 14px;
        }

        #updated {
            margin-top: 8px;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>

<body>

<h1>Advanced Crypto AI</h1>


<!-- BTC PRICE -->

<div class="box">

    <div class="title">
        BTC / USDT
    </div>

    <div
        id="btcPrice"
        class="price"
    >
        Loading...
    </div>

    <div
        id="status"
        class="green"
    >
        ● CONNECTING...
    </div>

    <div id="updated">
        Waiting for data...
    </div>

</div>


<!-- BTC VOLUME -->

<div class="box">

    <div class="title">
        BTC MARKET VOLUME
    </div>

    <div class="row">

        <span>
            1H Volume
        </span>

        <span
            id="volume1h"
            class="value"
        >
            Loading...
        </span>

    </div>


    <div class="row">

        <span>
            24H Volume
        </span>

        <span
            id="volume24h"
            class="value"
        >
            Loading...
        </span>

    </div>

</div>


<!-- COINGLASS LIQUIDATIONS -->

<div class="box">

    <div class="title">
        BTC LIQUIDATIONS — COINGLASS
    </div>


    <div class="row">

        <span>
            Long Liquidation
        </span>

        <span
            id="longLiquidation"
            class="value red"
        >
            API KEY REQUIRED
        </span>

    </div>


    <div class="row">

        <span>
            Short Liquidation
        </span>

        <span
            id="shortLiquidation"
            class="value green"
        >
            API KEY REQUIRED
        </span>

    </div>


    <div class="row">

        <span>
            Total Liquidation
        </span>

        <span
            id="totalLiquidation"
            class="value yellow"
        >
            API KEY REQUIRED
        </span>

    </div>

</div>


<script>


/* =========================
   BINANCE
========================= */

const PRICE_API =
    "https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT";


const KLINE_API =
    "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=24";


/* =========================
   COINGLASS
========================= */

/*
   CoinGlass API key should NOT
   be placed inside this APK.

   Leave empty for now.
*/

const COINGLASS_API_KEY = "";


/* =========================
   FORMAT USD
========================= */

function formatUSD(value) {

    const number =
        Number(value);

    if (!Number.isFinite(number))
        return "--";

    return "$" +
        number.toLocaleString(
            "en-US",
            {
                maximumFractionDigits: 0
            }
        );
}


/* =========================
   LOAD BTC PRICE + VOLUME
========================= */

async function loadMarket() {

    try {

        /* PRICE */

        const priceResponse =
            await fetch(PRICE_API);

        if (!priceResponse.ok)
            throw new Error(
                "Binance price error " +
                priceResponse.status
            );

        const priceData =
            await priceResponse.json();

        const btcPrice =
            Number(priceData.price);


        document.getElementById(
            "btcPrice"
        ).textContent =
            "$" +
            btcPrice.toLocaleString(
                "en-US",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );


        /* VOLUME */

        const volumeResponse =
            await fetch(KLINE_API);

        if (!volumeResponse.ok)
            throw new Error(
                "Binance volume error " +
                volumeResponse.status
            );

        const candles =
            await volumeResponse.json();


        /* 1H VOLUME */

        const latest =
            candles[candles.length - 1];

        const volume1h =
            Number(latest[5]);


        document.getElementById(
            "volume1h"
        ).textContent =
            volume1h.toLocaleString(
                "en-US",
                {
                    maximumFractionDigits: 2
                }
            ) + " BTC";


        /* 24H VOLUME */

        let volume24h = 0;

        candles.forEach(
            function(candle) {

                volume24h +=
                    Number(candle[5]);

            }
        );


        document.getElementById(
            "volume24h"
        ).textContent =
            volume24h.toLocaleString(
                "en-US",
                {
                    maximumFractionDigits: 2
                }
            ) + " BTC";


        /* STATUS */

        document.getElementById(
            "status"
        ).textContent =
            "● BINANCE LIVE";

        document.getElementById(
            "status"
        ).className =
            "green";


        document.getElementById(
            "updated"
        ).textContent =
            "Updated: " +
            new Date().toLocaleTimeString();


    }
    catch(error) {

        console.error(error);

        document.getElementById(
            "status"
        ).textContent =
            "● DATA ERROR";

        document.getElementById(
            "status"
        ).className =
            "red";

        document.getElementById(
            "updated"
        ).textContent =
            error.message;

    }

}


/* =========================
   COINGLASS LIQUIDATIONS
========================= */

async function loadLiquidations() {

    if (!COINGLASS_API_KEY) {

        document.getElementById(
            "longLiquidation"
        ).textContent =
            "API KEY REQUIRED";

        document.getElementById(
            "shortLiquidation"
        ).textContent =
            "API KEY REQUIRED";

        document.getElementById(
            "totalLiquidation"
        ).textContent =
            "API KEY REQUIRED";

        return;

    }


    try {

        const url =
            "https://open-api-v4.coinglass.com/api/futures/liquidation/aggregated-history" +
            "?exchange=Binance" +
            "&symbol=BTC" +
            "&interval=1h";


        const response =
            await fetch(
                url,
                {
                    headers: {
                        "CG-API-KEY":
                            COINGLASS_API_KEY
                    }
                }
            );


        if (!response.ok)
            throw new Error(
                "CoinGlass error " +
                response.status
            );


        const result =
            await response.json();


        const data =
            result.data;


        if (
            !data ||
            !data.length
        )
            throw new Error(
                "No liquidation data"
            );


        const latest =
            data[data.length - 1];


        const longValue =
            Number(
                latest.longLiquidation ||
                latest.long_liquidation ||
                0
            );


        const shortValue =
            Number(
                latest.shortLiquidation ||
                latest.short_liquidation ||
                0
            );


        const totalValue =
            longValue +
            shortValue;


        document.getElementById(
            "longLiquidation"
        ).textContent =
            formatUSD(longValue);


        document.getElementById(
            "shortLiquidation"
        ).textContent =
            formatUSD(shortValue);


        document.getElementById(
            "totalLiquidation"
        ).textContent =
            formatUSD(totalValue);

    }
    catch(error) {

        console.error(error);

        document.getElementById(
            "longLiquidation"
        ).textContent =
            "DATA ERROR";

        document.getElementById(
            "shortLiquidation"
        ).textContent =
            "DATA ERROR";

        document.getElementById(
            "totalLiquidation"
        ).textContent =
            "DATA ERROR";

    }

}


/* =========================
   START
========================= */

async function startApp() {

    await loadMarket();

    await loadLiquidations();

}


startApp();


/* AUTO REFRESH */

setInterval(
    startApp,
    15000
);

</script>

</body>
</html>
