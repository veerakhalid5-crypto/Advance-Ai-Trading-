<script>

const API =
    "https://api.binance.com/api/v3/klines";

const PRICE_API =
    "https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT";

let candles = [];


/* =========================
   FETCH MARKET DATA
========================= */

async function loadMarket() {

    try {

        const priceResponse =
            await fetch(PRICE_API);

        const priceData =
            await priceResponse.json();

        const price =
            Number(priceData.price);

        document.getElementById("btcPrice").textContent =
            "$" +
            price.toLocaleString(
                "en-US",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );


        const response =
            await fetch(
                API +
                "?symbol=BTCUSDT" +
                "&interval=15m" +
                "&limit=200"
            );

        if (!response.ok)
            throw new Error(
                "Market API " +
                response.status
            );


        const data =
            await response.json();


        candles =
            data.map(function(c) {

                return {

                    time: Number(c[0]),

                    open: Number(c[1]),

                    high: Number(c[2]),

                    low: Number(c[3]),

                    close: Number(c[4]),

                    volume: Number(c[5])

                };

            });


        document.getElementById("status").textContent =
            "● LIVE MARKET DATA";

        document.getElementById("status").style.color =
            "#38e89a";


        analyzeICT();


    }
    catch(error) {

        console.error(error);

        document.getElementById("status").textContent =
            "● DATA ERROR";

        document.getElementById("status").style.color =
            "#ff5964";

    }

}
