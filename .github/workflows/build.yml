name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        - name: Check JavaScript Syntax
          run: |
            python3 - <<'PY'
            import re
            import subprocess

            html = open("www/index.html", encoding="utf-8").read()
            scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)

            for i, script in enumerate(scripts, 1):
                open(f"/tmp/script_{i}.js", "w", encoding="utf-8").write(script)
                result = subprocess.run(
                    ["node", "--check", f"/tmp/script_{i}.js"],
                    text=True
                )
                if result.returncode != 0:
                    raise SystemExit(f"JavaScript syntax error in script {i}")
            PY
      - name: Verify App Source
        run: |
          echo "=== connectionStatus ==="
          grep -n "connectionStatus" www/index.html || true
          echo "=== loadMarket ==="
          grep -n "loadMarket" www/index.html || true
          echo "=== APP START ==="
          grep -n "APP START" www/index.html || true

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Advanced-Crypto-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
