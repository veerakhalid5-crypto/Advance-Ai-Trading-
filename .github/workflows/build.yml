name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Verify App Source
        run: |
          echo "=== connectionStatus ==="
          grep -n "connectionStatus" www/index.html || true
          echo "=== loadMarket ==="
          grep -n "loadMarket" www/index.html || true
          echo "=== APP START ==="
          grep -n "APP START" www/index.html || true

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Advanced-Crypto-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
