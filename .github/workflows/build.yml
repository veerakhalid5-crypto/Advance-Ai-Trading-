name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Check JavaScript Syntax
        run: |
          python3 - <<'PY'
          import re
          import subprocess

          html = open("www/index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)

          if not scripts:
              raise SystemExit("No JavaScript found")

          for i, script in enumerate(scripts, 1):
              path = f"/tmp/script_{i}.js"

              with open(path, "w", encoding="utf-8") as f:
                  f.write(script)

              result = subprocess.run(
                  ["node", "--check", path],
                  text=True
              )

              if result.returncode != 0:
                  raise SystemExit(
                      f"JavaScript syntax error in script {i}"
                  )

          print("JavaScript syntax check passed")
          PY

      - name: Add Android platform
        uses: actions/checkout@v4

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Advanced-Crypto-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
